name: tests
on: [push, pull_request]
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Decode every workflow GIF and check publishing limits
        run: python scripts/check_media.py --size 1000x620 docs/media/onboarding.gif docs/media/reduction.gif docs/media/regression.gif
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m rulebisect demo --out demo-evidence
      - run: python -m rulebisect demo --scenario regression --out regression-evidence
      - run: python -m rulebisect demo --scenario fix --out fix-evidence
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python -m pip install --no-deps --force-reinstall --no-index --find-links dist rulebisect
      - name: Smoke test the installed wheel outside the source checkout
        working-directory: ${{ runner.temp }}
        run: rulebisect demo --scenario fix --out installed-wheel-evidence
      - name: Exercise the installed guided workflow
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/.github/scripts/smoke_workflow.py" "${{ github.workspace }}"
